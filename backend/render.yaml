services:
  - type: web
    name: streamflix-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TMDB_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: streamflix-db
          property: connectionString

databases:
  - name: streamflix-db
    plan: free
    databaseName: streamflix
    user: streamflix
