name: Refresh static catalog

# The homepage and SEO detail pages are build-time static so they never consume
# Vercel ISR writes. This scheduled deploy refreshes the catalog once a week.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
