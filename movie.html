<!DOCTYPE html>
<html lang="en">

<head>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="0fbb83bd-d242-44ea-b99b-fe81f1380d03"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GM491BBS2F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-GM491BBS2F');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="pageDescription" name="description" content="View movie and TV show details on StreamFlix.">
  <meta name="robots" content="index, follow">
  <link id="canonicalUrl" rel="canonical" href="https://streamflix.pro.et/movie.html">
  <meta id="ogTitle" property="og:title" content="Details - StreamFlix">
  <meta id="ogDescription" property="og:description" content="View movie and TV show details on StreamFlix.">
  <meta id="ogUrl" property="og:url" content="https://streamflix.pro.et/movie.html">
  <meta id="ogImage" property="og:image" content="">
  <meta property="og:site_name" content="StreamFlix">
  <meta property="og:type" content="video.movie">
  <title>Details - StreamFlix</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a href="index.html" class="logo">Stream<span>Flix</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="watchlist.html">My List</a>
    </nav>
  </header>

  <div class="detail-hero">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-content">
      <img id="moviePoster" class="detail-poster" alt="">
      <div class="detail-info">
        <h1 id="movieTitle"></h1>
        <div class="detail-meta">
          <span id="movieYear"></span>
          <span class="rating">★ <span id="movieRating"></span></span>
          <span id="movieRuntime"></span>
        </div>
        <div class="detail-genres" id="movieGenres"></div>
        <p class="detail-plot" id="moviePlot"></p>
        <p class="detail-cast"><strong>Cast:</strong> <span id="movieActors"></span></p>
        <div class="detail-actions">
          <button class="btn" id="watchNowBtn">▶ Watch Now</button>
          <button class="btn btn-secondary" id="watchTrailerBtn">▶ Trailer</button>
          <button class="btn btn-gold" id="addWatchlistBtn">+ My List</button>
        </div>
      </div>
    </div>
  </div>

  <section id="trailerSection">
    <h2>Trailer</h2>
    <div class="trailer-wrapper">
      <iframe id="trailerIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
