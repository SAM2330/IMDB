<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFlix - Watch Movies & TV Shows</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a href="index.html" class="logo">Stream<span>Flix</span></a>
    <form id="searchForm">
      <input type="text" id="searchInput" placeholder="Search movies & shows...">
      <button type="submit">Search</button>
    </form>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="watchlist.html">My List</a>
    </nav>
  </header>

  <div class="hero" id="heroBanner">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-content" id="heroContent">
      <h1 id="heroTitle">Loading...</h1>
      <p id="heroOverview"></p>
      <div class="hero-actions">
        <button class="btn" id="heroPlayBtn">▶ Watch Now</button>
        <button class="btn btn-secondary" id="heroInfoBtn">ℹ More Info</button>
      </div>
    </div>
  </div>

  <main>
    <section class="top10-section">
      <h2>🔥 Trending This Week</h2>
      <div class="top3" id="top3"></div>
      <div class="grid" id="top10rest"></div>
    </section>

    <section>
      <h2>Top Picks For You</h2>
      <div class="movie-carousel" id="topPicks"></div>
    </section>

    <section>
      <h2>Fan Favorites</h2>
      <div class="movie-carousel" id="fanFavorites"></div>
    </section>

    <section>
      <h2>Action Movies</h2>
      <div class="movie-carousel" id="actionMovies"></div>
    </section>

    <section>
      <h2>Drama Series</h2>
      <div class="movie-carousel" id="dramaTV"></div>
    </section>

    <section>
      <h2>Comedy Movies</h2>
      <div class="movie-carousel" id="comedyMovies"></div>
    </section>

    <section>
      <h2>Thriller Movies</h2>
      <div class="movie-carousel" id="thrillerMovies"></div>
    </section>

    <section>
      <h2>Sci-Fi Series</h2>
      <div class="movie-carousel" id="scifiTV"></div>
    </section>

    <section>
      <h2>Crime Series</h2>
      <div class="movie-carousel" id="crimeTV"></div>
    </section>

    <section>
      <h2>Mystery Series</h2>
      <div class="movie-carousel" id="mysteryTV"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
